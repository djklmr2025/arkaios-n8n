services:
  - type: web
    name: arkaios-n8n
    runtime: docker
    repo: https://github.com/djklmr2025/arkaios-n8n
    branch: main
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: arkaios-n8n-db
          property: database
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: arkaios-n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: arkaios-n8n-db
          property: port
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: arkaios-n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: arkaios-n8n-db
          property: password
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: WEBHOOK_URL
        value: https://arkaios-n8n.onrender.com
      - key: N8N_HOST
        value: arkaios-n8n.onrender.com
      - key: N8N_EDITOR_BASE_URL
        value: https://arkaios-n8n.onrender.com/
      - key: GENERIC_TIMEZONE
        value: America/Mexico_City
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        generateValue: true

databases:
  - name: arkaios-n8n-db
    plan: free
    region: oregon
